[project]
name = "findrai"
version = "0.1.0"
description = "FindrAI Campus Multi-Modal Lost and Found Intelligence System"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[tool.vercel]
entrypoint = "backend.main:app"
